name: railway_dio
description: "A Dio client factory and a Response -> Either<NetworkFailure, T> mapper for railway-oriented error handling in Flutter/Dart."
version: 0.1.0
homepage: https://github.com/StuckNot/railway_dio
repository: https://github.com/StuckNot/railway_dio
topics:
  - dio
  - railway
  - either
  - error-handling
  - network

environment:
  sdk: ^3.11.5

dependencies:
  dio: ^5.7.0
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.4.13
  freezed: ^3.2.5
  lints: ^6.1.0
  test: ^1.31.1
